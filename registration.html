<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    <link rel="stylesheet" href="./registration.css">
    <link rel="stylesheet" href="./style.css">
    <title>REGISTRATION-PAGE</title>
</head>
<body>
    <main>
        
        

            <!-- ===============-registration-PAGE========= -->
        <div class="signup-container">
            <h2>SIGN UP</h2>
            <form id="registerForm">

                <div class="input-group">
                    <input type="first name" id="firstName" placeholder="First Name" required>
                </div>

                <div class="input-group">
                    <input type="last name" id="lastName" placeholder="Last Name" required>
                </div>

                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <input id="regPassword" type="password" placeholder="Password: Minimum 8 characters" required>
                    <i class="ri-eye-off-line" id="togglePassword" style="cursor: pointer;"></i>
                </div>
                
                <button type="submit" class="signup-btn sign-up-btn">Register</button>

                <div class="signup-links">
                    <span>Already have an account?</span>
                    <a href="./index.html">Login</a>
                </div>
            </form>
        </div>
        </form>
</div>
         


    </main>
<script src="./registration.js"></script>
</body>
</html>
