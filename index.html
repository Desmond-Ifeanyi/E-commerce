<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./style.css">
    <title>login</title>
</head>
<body>
    <main>
        


            <!-- ===============REGISTRATION-PAGE========= -->

         <div class="login-container">
            <h2>LOGIN</h2>
            <form id="loginForm">
                <div class="input-group">
                    <input type="first name" id="firstName" placeholder="First Name" required>
                </div>

                <div class="input-group">
                    <input type="last name" id="lastName" placeholder="Last Name" required>
                </div>

                <div class="input-group">
                <input id="loginPassword" type="password" placeholder="Password: Minimum 8 characters" required>
                <i class="ri-eye-off-line login-toggle" id="logintoggle" style="cursor: pointer;"></i>
                </div>
                
                <div class="login-links">
                <div class="link-row">
                    <span>Forgot Password?</span>
                    <a href="#">Reset Password</a>
                </div>
                <div class="link-row">
                    <span>New Customer?</span>
                    <a href="./registration.html">Sign up</a>
                </div>
                </div>

                <button type="submit" class="sign-in-btn">SIGN IN</button>
            </form>
        </div>




<!-- ================footer============ -->


    </main>

    <script src="./login.js"></script>
</body>
</html>
